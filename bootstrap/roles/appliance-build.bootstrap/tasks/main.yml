---
- name: Remove default apt sources
  ansible.builtin.command: bash -c 'rm -rf /etc/apt/sources.list.d/*'
  changed_when: true

- name: Configure apt sources
  vars:
    mirror_url: "{{ lookup('env', 'DELPHIX_PACKAGE_MIRROR_MAIN') }}"
  block:
    - name: Configure noble apt source
      ansible.builtin.apt_repository:
        repo: "deb {{ mirror_url }} noble main restricted multiverse universe"
        state: present
    - name: Configure noble-updates apt source
      ansible.builtin.apt_repository:
        repo: "deb {{ mirror_url }} noble-updates main restricted multiverse universe"
        state: present
    - name: Configure noble-security apt source
      ansible.builtin.apt_repository:
        repo: "deb {{ mirror_url }} noble-security main"
        state: present

- name: Stop unattended-upgrades systemd service in preparation for package removal
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
  register: result_systemd_stop
  failed_when: "result_systemd_stop is failed and 'Could not find the requested service' not in result_systemd_stop.msg"

- name: Remove unattended-upgrades package
  ansible.builtin.apt:
    name:
      - unattended-upgrades
    state: absent
    purge: true

- name: Update apt cache and install apt packages
  ansible.builtin.apt:
    name:
      - ansible
      - aptly
      - bc
      - coreutils
      - devscripts
      - equivs
      - gdisk
      - git
      - java-package
      - jq
      - kpartx
      - libxt6
      - livecd-rootfs
      - make
      - man
      - openjdk-8-jdk-headless
      - openjdk-17-jdk-headless
      - pigz
      - python3-passlib
      - python3-pip
      - qemu-system
      - rename
      - shellcheck
      - vim
      - zfsutils-linux
    state: present
    update_cache: true

# awscli is distributed via pip or snap on 24.04. While the package is not required by the product,
# it is required by appliance-build itself.
- name: Install awscli python package
  ansible.builtin.pip:
    name: awscli
    break_system_packages: true
  become: true

- name: Load ZFS kernel module.
  community.general.modprobe:
    name: zfs
    state: present

- name: Add delphix user to docker group required by the virtualization package
  ansible.builtin.user:
    name: delphix
    groups: docker
    append: true

- name: Install syft (CycloneDX SBOM generator)
  ansible.builtin.shell:
    cmd: >
      curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh |
      sh -s -- -b /usr/local/bin {{ syft_version }}
    creates: /usr/local/bin/syft

- name: Install check-jsonschema (offline CycloneDX schema validator)
  ansible.builtin.pip:
    name: check-jsonschema
    break_system_packages: true

- name: Create CycloneDX schema directory
  ansible.builtin.file:
    path: "{{ cyclonedx_schema_dir }}"
    state: directory
    mode: "0755"

- name: Download CycloneDX {{ cyclonedx_schema_version }} JSON schema
  ansible.builtin.get_url:
    url: "https://cyclonedx.org/schema/bom-{{ cyclonedx_schema_version }}.schema.json"
    dest: "{{ cyclonedx_schema_dir }}/bom-{{ cyclonedx_schema_version }}.schema.json"
    mode: "0644"
    force: false
