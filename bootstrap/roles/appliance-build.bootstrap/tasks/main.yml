---
- name: Remove default apt sources
  ansible.builtin.command: bash -c 'rm -rf /etc/apt/sources.list.d/*'
  changed_when: true

- name: Configure apt sources
  vars:
    mirror_url: "{{ lookup('env', 'DELPHIX_PACKAGE_MIRROR_MAIN') }}"
  block:
    # Different branches mirror different Ubuntu releases (e.g. os-upgrade mirrors the next
    # release under test, not the current one), so the suite name can't be hardcoded. The
    # mirror's own directory listing is the source of truth for which suite a given branch
    # actually publishes.
    - name: Determine the Ubuntu suite this branch's mirror publishes
      ansible.builtin.uri:
        url: "{{ mirror_url }}/dists/"
        return_content: true
      register: mirror_dists_index

    - name: Resolve the base suite name (the one entry without a -backports/-security/-updates suffix)
      ansible.builtin.set_fact:
        ubuntu_suite: "{{ (mirror_dists_index.content | regex_findall('href=\"([a-z]+)/\"')) | first }}"

    - name: Configure base apt source
      ansible.builtin.apt_repository:
        repo: "deb {{ mirror_url }} {{ ubuntu_suite }} main restricted multiverse universe"
        state: present
    - name: Configure updates apt source
      ansible.builtin.apt_repository:
        repo: "deb {{ mirror_url }} {{ ubuntu_suite }}-updates main restricted multiverse universe"
        state: present
    - name: Configure security apt source
      ansible.builtin.apt_repository:
        repo: "deb {{ mirror_url }} {{ ubuntu_suite }}-security main"
        state: present

- name: Stop unattended-upgrades systemd service in preparation for package removal
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
  register: result_systemd_stop
  failed_when: "result_systemd_stop is failed and 'Could not find the requested service' not in result_systemd_stop.msg"

- name: Remove unattended-upgrades package
  ansible.builtin.apt:
    name:
      - unattended-upgrades
    state: absent
    purge: true

- name: Update apt cache and install apt packages
  ansible.builtin.apt:
    name:
      - ansible
      - aptly
      - bc
      - coreutils
      - devscripts
      - equivs
      - gdisk
      - git
      - java-package
      - jq
      - kpartx
      - libxt6
      - livecd-rootfs
      - make
      - man
      - openjdk-8-jdk-headless
      - openjdk-17-jdk-headless
      - pigz
      - python3-passlib
      - python3-pip
      - qemu-system
      - rename
      - shellcheck
      - vim
      - zfsutils-linux
    state: present
    update_cache: true

# awscli is distributed via pip or snap on 24.04. While the package is not required by the product,
# it is required by appliance-build itself.
- name: Install awscli python package
  ansible.builtin.pip:
    name: awscli
    break_system_packages: true
  become: true

- name: Load ZFS kernel module.
  community.general.modprobe:
    name: zfs
    state: present

- name: Add delphix user to docker group required by the virtualization package
  ansible.builtin.user:
    name: delphix
    groups: docker
    append: true
