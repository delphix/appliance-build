---
- name: Assert GITHUB_TOKEN is set
  ansible.builtin.assert:
    that:
      - lookup('env', 'GITHUB_TOKEN') | length > 0
    fail_msg: "GITHUB_TOKEN must be set to build the internal-claude variant."

- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Create support-tools group
  ansible.builtin.group:
    name: support-tools
    gid: 4000
    state: present

- name: Add delphix user to support-tools group
  ansible.builtin.user:
    name: delphix
    groups: support-tools
    append: true

- name: Create /nas mount point
  ansible.builtin.file:
    path: /nas
    state: directory
    mode: "0755"

- name: Install nas.mount systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nas.mount
    mode: "0644"
    content: |
      [Unit]
      Description=Support Tools NAS
      After=network-online.target
      Wants=network-online.target

      [Mount]
      What=support-tools-nas.delphix.com:/
      Where=/nas
      Type=nfs4
      Options=defaults

      [Install]
      WantedBy=multi-user.target

- name: Enable nas.mount unit
  ansible.builtin.systemd:
    name: nas.mount
    enabled: true

- name: Install curl, git, and Node.js
  ansible.builtin.apt:
    name:
      - curl
      - git
      - nodejs
      - npm
    state: present

- name: Install Claude CLI via npm
  ansible.builtin.command: npm install -g @anthropic-ai/claude-code
  args:
    creates: /usr/local/bin/claude
  changed_when: true

# The DCenter CLI, so skills can run `dc` on the image itself rather than over ssh to
# dlpxdc.co -- a clone carries authorized_keys but no private key to make that hop with. It
# gets its own virtualenv because dlpxdccommand pins boto3/botocore, which would fight the
# awscli install in minimal-internal.
- name: Install python3-venv for the DCenter client
  ansible.builtin.apt:
    name: python3-venv
    state: present

# The index is delphix-virtual-pypi, not the delphix-local one dcoa's README documents:
# delphix-local carries dlpxdccommand but no setuptools, so pip cannot resolve its build
# dependencies there and fails on "No matching distribution found for setuptools>=40.8.0".
- name: Install the DCenter client into /opt/dcenter-client
  ansible.builtin.pip:
    name: dlpxdccommand
    virtualenv: /opt/dcenter-client
    virtualenv_command: /usr/bin/python3 -m venv
    extra_args: >-
      --no-cache-dir
      --index-url
      https://artifactory.delphix.com/artifactory/api/pypi/delphix-virtual-pypi/simple/

# A wrapper rather than a symlink into the venv's bin, which also holds python3 and pip:
# that directory on PATH would send every bare `python3` on the image into this virtualenv.
- name: Install the dc wrapper into /usr/local/bin
  ansible.builtin.copy:
    dest: /usr/local/bin/dc
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      #
      # Installed by appliance-build.claude-internal -- edit that role, not this file.
      #
      # DLPX_DC_API_HOST is pinned because the dlpxdccommand build on Artifactory defaults
      # to a decommissioned API gateway (2.0.3 defaults to r46rgdk3u4..., which NXDOMAINs)
      # while reporting the same --version as a working client, so the bad default cannot
      # be spotted from the version. This value is DEFAULT_API_HOST in dcoa's
      # components/dc-command/src/main/python/dlpxdccommand/command/dc_cmds.py.
      #
      # Credentials are left to the caller: interactively, run `dc login` once; in
      # automation, export DLPX_DEFAULT_CREDENTIALS=true to authenticate off the standard
      # AWS credential chain instead of a dcoa profile.
      #
      export DLPX_DC_API_HOST="${DLPX_DC_API_HOST:-sknncxtzxf.execute-api.us-west-2.amazonaws.com}"
      exec /opt/dcenter-client/bin/dc "$@"

- name: Create ~delphix/src directory
  ansible.builtin.file:
    path: "{{ claude_internal_src_dir }}"
    state: directory
    owner: delphix
    group: staff
    mode: "g+w"

# The repository list lives in this role's defaults/main.yml -- see the comments there for
# what is in it and why. Retries are worth it here because the list is long enough, and
# the gates large enough, that a single transient GitHub failure would otherwise discard
# an entire image build.
- name: Clone product repositories
  ansible.builtin.git:
    repo: "https://{{ lookup('env', 'GITHUB_TOKEN') }}@github.com/{{ item.org | default('delphix') }}/{{ item.name }}.git"
    dest: "{{ claude_internal_src_dir }}/{{ item.name }}"
    version: "{{ item.version }}"
    depth: "{{ item.depth | default(omit) }}"
    update: false
  loop: "{{ claude_internal_repos }}"
  register: clone_result
  until: clone_result is succeeded
  retries: 3
  delay: 5
  no_log: true

# No no_log here, unlike the clone above: these commands carry no token, and suppressing
# their output only makes a failure among this many repositories harder to place.
- name: Reset clone URLs to SSH (strips the build-time bot token)
  ansible.builtin.command:
    cmd: >
      git -C {{ claude_internal_src_dir }}/{{ item.name }}
      remote set-url origin
      git@github.com:{{ item.org | default('delphix') }}/{{ item.name }}.git
  loop: "{{ claude_internal_repos }}"
  changed_when: false

# A shallow clone is also a single-branch clone: git narrows remote.origin.fetch to just
# the one branch that was cloned, so on the image neither "git fetch --unshallow" nor a
# checkout of any other branch would see anything else. Restoring the wildcard refspec
# makes both work. This is a no-op for the full clones, which already have this value.
- name: Restore the wildcard fetch refspec (shallow clones are single-branch)
  ansible.builtin.command:
    cmd: >
      git -C {{ claude_internal_src_dir }}/{{ item.name }}
      config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*
  loop: "{{ claude_internal_repos }}"
  changed_when: false

- name: Ensure ~delphix/src is owned by delphix:staff with group-write
  ansible.builtin.file:
    path: "{{ claude_internal_src_dir }}"
    state: directory
    owner: delphix
    group: staff
    mode: "g+w"
    recurse: true

- name: Allow apt sources to be modified post-boot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-delphix-claude.cfg
    mode: "0644"
    content: |
      apt:
        preserve_sources_list: false

- name: Add git-utils/bin to PATH for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/git-utils-path.sh
    mode: "0644"
    content: 'export PATH="$PATH:{{ claude_internal_src_dir }}/git-utils/bin"'

# The kg plugin's skills look at $KG_DIR first and otherwise clone the corpus into
# ~/.cache/delphix-kg themselves, so without this an agentic run on a fresh image pays for
# a second copy of a repository the image already carries. profile.d rather than the role's
# other config sites because that is where this role already puts shell environment (see
# git-utils-path.sh above), and it is what an interactive shell and Claude Code's own bash
# tool both read.
- name: Point the kg skills at the pre-installed knowledge-graph clone
  ansible.builtin.copy:
    dest: /etc/profile.d/knowledge-graph.sh
    mode: "0644"
    content: 'export KG_DIR="{{ claude_internal_src_dir }}/knowledge-graph"'
