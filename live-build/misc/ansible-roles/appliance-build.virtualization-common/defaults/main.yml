---
#
# Whether to install the host-jdks package, which provides the JDKs that the
# virtualization engine pushes to host environments. It isn't a dependency of
# delphix-virtualization, so variants that don't manage host environments
# (i.e. DCT) can set this to false to leave it out of both the image and the
# upgrade image.
#
install_host_jdks: true
