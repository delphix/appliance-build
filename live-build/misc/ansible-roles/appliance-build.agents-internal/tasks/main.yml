---
- name: Assert GITHUB_TOKEN is set
  ansible.builtin.assert:
    that:
      - lookup('env', 'GITHUB_TOKEN') | length > 0
    fail_msg: "GITHUB_TOKEN must be set to build an image with the agents-internal role."

- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Create support-tools group
  ansible.builtin.group:
    name: support-tools
    gid: 4000
    state: present

- name: Add delphix user to support-tools group
  ansible.builtin.user:
    name: delphix
    groups: support-tools
    append: true

- name: Create /nas mount point
  ansible.builtin.file:
    path: /nas
    state: directory
    mode: "0755"

- name: Install nas.mount systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/nas.mount
    mode: "0644"
    content: |
      [Unit]
      Description=Support Tools NAS
      After=network-online.target
      Wants=network-online.target

      [Mount]
      What=support-tools-nas.delphix.com:/
      Where=/nas
      Type=nfs4
      Options=defaults

      [Install]
      WantedBy=multi-user.target

- name: Enable nas.mount unit
  ansible.builtin.systemd:
    name: nas.mount
    enabled: true

- name: Install curl, git, jq, and Node.js
  ansible.builtin.apt:
    name:
      - curl
      - git
      - jq
      - nodejs
      - npm
    state: present

# The DCenter CLI, so skills can run `dc` on the image itself rather than over ssh to
# dlpxdc.co -- a clone carries authorized_keys but no private key to make that hop with. It
# gets its own virtualenv because dlpxdccommand pins boto3/botocore, which would fight the
# awscli install in minimal-internal.
- name: Install python3-venv for the DCenter client
  ansible.builtin.apt:
    name: python3-venv
    state: present

# The client is built from dcoa's python/command at the dcoa/live tag, the same source and
# packaging dlpxdc.co installs from. The dlpxdccommand package on Artifactory is not
# published from that tag, so it lags what dlpxdc.co runs.
- name: Create a scratch directory for the dcoa checkout
  ansible.builtin.tempfile:
    state: directory
  register: dcoa_checkout

- name: Check out dcoa at the dcoa/live tag
  ansible.builtin.git:
    repo: "https://{{ lookup('env', 'GITHUB_TOKEN') }}@github.com/delphix/dcoa.git"
    dest: "{{ dcoa_checkout.path }}"
    version: dcoa/live
    depth: 1
  no_log: true

# The index is delphix-virtual-pypi, not the delphix-local one dcoa's README documents:
# delphix-local has no setuptools, so pip cannot resolve the build dependencies there and
# fails on "No matching distribution found for setuptools>=40.8.0".
- name: Install the DCenter client into /opt/dcenter-client
  ansible.builtin.pip:
    name: "{{ dcoa_checkout.path }}/python/command"
    virtualenv: /opt/dcenter-client
    virtualenv_command: /usr/bin/python3 -m venv
    extra_args: >-
      --no-cache-dir
      --index-url
      https://artifactory.delphix.com/artifactory/api/pypi/delphix-virtual-pypi/simple/

- name: Remove the dcoa checkout
  ansible.builtin.file:
    path: "{{ dcoa_checkout.path }}"
    state: absent

- name: Link dc into /usr/local/bin
  ansible.builtin.file:
    src: /opt/dcenter-client/bin/dc
    dest: /usr/local/bin/dc
    state: link

# gitleaks, which every writer to the knowledge graph runs before pushing, and without
# which that repo's append-run.sh refuses to write (its SCHEMA.md Section 14). Ubuntu's
# package is too old for the configuration the knowledge graph uses, so the latest
# release is installed instead, verified against the checksums published with it. The
# release is found from github.com's /releases/latest redirect rather than the API, which
# rate-limits unauthenticated requests.
- name: Find the latest gitleaks release
  ansible.builtin.uri:
    url: https://github.com/gitleaks/gitleaks/releases/latest
    method: HEAD
    follow_redirects: none
    status_code: 302
  register: gitleaks_latest

- name: Set the gitleaks release to install
  ansible.builtin.set_fact:
    gitleaks_tag: "{{ gitleaks_latest.location | basename }}"
    gitleaks_version: "{{ gitleaks_latest.location | basename | regex_replace('^v', '') }}"

- name: Create a scratch directory for the gitleaks download
  ansible.builtin.tempfile:
    state: directory
  register: gitleaks_download

- name: Download gitleaks
  ansible.builtin.get_url:
    url: "https://github.com/gitleaks/gitleaks/releases/download/{{ gitleaks_tag }}/gitleaks_{{ gitleaks_version }}_linux_x64.tar.gz"
    dest: "{{ gitleaks_download.path }}/gitleaks.tar.gz"
    checksum: "sha256:https://github.com/gitleaks/gitleaks/releases/download/{{ gitleaks_tag }}/gitleaks_{{ gitleaks_version }}_checksums.txt"
    mode: "0644"

- name: Install gitleaks into /usr/local/bin
  ansible.builtin.unarchive:
    src: "{{ gitleaks_download.path }}/gitleaks.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    include: [gitleaks]
    owner: root
    group: root
    mode: "0755"

- name: Remove the gitleaks download
  ansible.builtin.file:
    path: "{{ gitleaks_download.path }}"
    state: absent

# The GitHub CLI, which the skills use for every PR and API call. It comes from GitHub's
# own apt repository, not the Ubuntu mirror's older gh, and it takes the latest release at
# build time.
- name: Install the GitHub CLI apt signing key
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: /etc/apt/keyrings/githubcli-archive-keyring.gpg
    mode: "0644"

# The vm-artifacts hook 83-etc-apt-sources-list.binary writes this line back after
# emptying sources.list.d; change both together.
- name: Add the GitHub CLI apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/github-cli.list
    mode: "0644"
    content: |
      deb [arch=amd64 signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main

- name: Install the GitHub CLI
  ansible.builtin.apt:
    name: gh
    update_cache: true
    state: present

- name: Create ~delphix/src directory
  ansible.builtin.file:
    path: "{{ agents_internal_src_dir }}"
    state: directory
    owner: delphix
    group: staff
    mode: "g+w"

# The repository list lives in this role's defaults/main.yml -- see the comments there for
# what is in it and why. Retries are worth it here because the list is long enough, and
# the gates large enough, that a single transient GitHub failure would otherwise discard
# an entire image build.
- name: Clone product repositories
  ansible.builtin.git:
    repo: "https://{{ lookup('env', 'GITHUB_TOKEN') }}@github.com/{{ item.org | default('delphix') }}/{{ item.name }}.git"
    dest: "{{ agents_internal_src_dir }}/{{ item.name }}"
    version: "{{ item.version }}"
    depth: "{{ item.depth | default(omit) }}"
    single_branch: "{{ item.single_branch | default(omit) }}"
    update: false
  loop: "{{ agents_internal_repos }}"
  register: clone_result
  until: clone_result is succeeded
  retries: 3
  delay: 5
  no_log: true

# No no_log here, unlike the clone above: these commands carry no token, and suppressing
# their output only makes a failure among this many repositories harder to place.
- name: Reset clone URLs to SSH (strips the build-time bot token)
  ansible.builtin.command:
    cmd: >
      git -C {{ agents_internal_src_dir }}/{{ item.name }}
      remote set-url origin
      git@github.com:{{ item.org | default('delphix') }}/{{ item.name }}.git
  loop: "{{ agents_internal_repos }}"
  changed_when: false

# A shallow clone is also a single-branch clone, as is one with single_branch set: git
# narrows remote.origin.fetch to just the one branch that was cloned, so on the image a
# checkout of any other branch (or, for a shallow clone, "git fetch --unshallow") would
# see nothing else. Restoring the wildcard refspec fixes that. This is a no-op for the
# full clones, which already have this value.
- name: Restore the wildcard fetch refspec (shallow and single-branch clones)
  ansible.builtin.command:
    cmd: >
      git -C {{ agents_internal_src_dir }}/{{ item.name }}
      config remote.origin.fetch +refs/heads/*:refs/remotes/origin/*
  loop: "{{ agents_internal_repos }}"
  changed_when: false

- name: Exclude fetch_exclude branches from the default fetch refspec
  ansible.builtin.command:
    cmd: >
      git -C {{ agents_internal_src_dir }}/{{ item.0.name }}
      config --add remote.origin.fetch ^refs/heads/{{ item.1 }}
  loop: "{{ agents_internal_repos | subelements('fetch_exclude', skip_missing=True) }}"
  changed_when: false

- name: Ensure ~delphix/src is owned by delphix:staff with group-write
  ansible.builtin.file:
    path: "{{ agents_internal_src_dir }}"
    state: directory
    owner: delphix
    group: staff
    mode: "g+w"
    recurse: true

- name: Allow apt sources to be modified post-boot
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-delphix-claude.cfg
    mode: "0644"
    content: |
      apt:
        preserve_sources_list: false

- name: Add git-utils/bin to PATH for login shells
  ansible.builtin.copy:
    dest: /etc/profile.d/git-utils-path.sh
    mode: "0644"
    content: 'export PATH="$PATH:{{ agents_internal_src_dir }}/git-utils/bin"'

# The kg plugin's skills look at $KG_DIR first and otherwise clone the corpus into
# ~/.cache/delphix-kg themselves, so without this an agentic run on a fresh image pays for
# a second copy of a repository the image already carries. profile.d because that is where
# this role already puts shell environment (see git-utils-path.sh above), and it is what an
# interactive shell and an agent harness's own shell tool both read.
- name: Point the kg skills at the pre-installed knowledge-graph clone
  ansible.builtin.copy:
    dest: /etc/profile.d/knowledge-graph.sh
    mode: "0644"
    content: 'export KG_DIR="{{ agents_internal_src_dir }}/knowledge-graph"'
