---
#
# The guard on the one ordering constraint git-utils-venv.yml has, imported last in this
# role so that it sees every task that could have broken it. "python3 -m venv" leaves
# .venv/bin/python3 as an absolute symlink to /usr/bin/python3, and Ansible's file module
# lchowns what a symlink names while recursing, so any recursive chown of ~delphix/src
# that runs once the virtualenv exists hands /usr/bin/python3 itself to delphix:staff.
# Nothing else in the build looks at /usr/bin/python3, and the image boots either way, so
# without this the mistake reaches a VM rather than a build log.
#
# The stat is deliberately on /usr/bin/python3 and not on /usr/bin/python3.12: the chown
# moves the symlink, never its target.
#
- name: Read the owner of the system python3 symlink
  ansible.builtin.stat:
    path: /usr/bin/python3
    follow: false
  register: agents_internal_system_python3

- name: Check that no recursive chown followed the virtualenv out of ~delphix/src
  ansible.builtin.assert:
    that:
      - agents_internal_system_python3.stat.exists
      - agents_internal_system_python3.stat.pw_name == 'root'
      - agents_internal_system_python3.stat.gr_name == 'root'
    success_msg: /usr/bin/python3 is still root:root
    fail_msg: >-
      /usr/bin/python3 is owned by
      {{ agents_internal_system_python3.stat.pw_name | default('(no such file)') }}:{{
      agents_internal_system_python3.stat.gr_name | default('(no such file)') }},
      not root:root. A task that chowns ~delphix/src recursively has run after
      git-utils-venv.yml built the virtualenv and followed .venv/bin/python3 out of it.
      Move that task above the virtualenv, or give it "chown -R -P" as
      git-utils-venv.yml uses.
