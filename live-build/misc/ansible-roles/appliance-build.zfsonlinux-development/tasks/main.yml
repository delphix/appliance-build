#
# This role allows building ZFS on the appliance.
#
---
- apt:
    name:
      - alien
      - autoconf
      - build-essential
      - cppcheck
      - curl
      - delphix-go
      - delphix-rust
      - dh-dkms
      - dwarves
      - fakeroot
      - flake8
      - gdebi
      - git
      - gawk
      - ksh
      - libattr1-dev
      - libblkid-dev
      - libelf-dev
      - libselinux-dev
      - libssl-dev
      - libtirpc-dev
      - libtool-bin
      - libudev-dev
      - llvm-14
      - lsscsi
      - mandoc
      - mold
      - nfs-kernel-server
      - parted
      - pkg-config
      - python3-minimal
      - shellcheck
      - targetcli-fb
      - unzip
      - uuid-dev
      - wget
      - xxhash
      - zlib1g-dev
    state: present
  register: result
  until: result is not failed
  retries: 3
  delay: 60

- git:
    repo: "https://{{ lookup('env', 'GITHUB_TOKEN') }}@github.com/delphix/zfs.git"
    dest:
      "/home/delphix/zfs"
    version: develop
    accept_hostkey: yes
    update: no
  register: zfs_clone
  when: lookup('env', 'GITHUB_TOKEN') != ''
  no_log: yes

#
# git stores the clone URL, credential and all, in the checkout's own config,
# which this image then ships. Reset the remote to a URL that carries none;
# fetching from it on the running VM uses that user's own credential.
#
- community.general.git_config:
    name: remote.origin.url
    scope: local
    repo: "/home/delphix/zfs"
    value: "https://github.com/delphix/zfs.git"
  when: zfs_clone is not skipped

- file:
    path: "/home/delphix/zfs"
    owner: delphix
    group: staff
    state: directory
    recurse: yes

- file:
    path: "/home/delphix/.cargo/"
    state: directory
    owner: delphix
    group: staff
- copy:
    dest: "/home/delphix/.cargo/config.toml"
    content: |
        [target.x86_64-unknown-linux-gnu]
        rustflags = ["-C", "link-arg=-B/usr/libexec/mold"]
