---
- name: Install opencode
  ansible.builtin.include_role:
    name: appliance-build.agents-internal
    tasks_from: install-release
  vars:
    release_name: opencode
    release_version: "{{ opencode_internal_version }}"
    release_url: "https://github.com/anomalyco/opencode/releases/download/v{{ opencode_internal_version }}/opencode-linux-x64.tar.gz"
    release_sha256: "{{ opencode_internal_sha256 }}"
    release_archive: true
    release_binary: opencode
