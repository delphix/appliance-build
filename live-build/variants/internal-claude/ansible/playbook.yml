---
- name: Configure internal-claude variant
  hosts: all
  gather_facts: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    #
    # The *-development roles clone dlpx-app-gate, dms-core-gate and zfs
    # straight into ~delphix. claude-internal already clones those repos,
    # and every other engine repo, into ~delphix/src, so skip the ~delphix
    # copies: two clones of the same repo in different places leave an
    # agent unsure which one to read and change.
    #
    skip_home_source_clones: true
  #
  # This variant is the internal-dev variant plus the Claude Code tooling in
  # claude-internal, so every role up to that one should match the internal-dev
  # playbook, in the same order. When a role is added to or removed from that
  # playbook, this one should follow. There are two deliberate differences:
  # delphix-ldap (and the passwordless_ldap_sudo it reads) is left out, because
  # this image is driven as the local delphix user, not by LDAP logins; and
  # skip_home_source_clones is set, for the reason above.
  #
  roles:
    - appliance-build.minimal-common
    - appliance-build.minimal-internal
    - appliance-build.masking-common
    - appliance-build.masking-development
    - appliance-build.qa-internal
    - appliance-build.virtualization-common
    - appliance-build.virtualization-development
    - appliance-build.zfsonlinux-development
    - appliance-build.claude-internal
