---
- hosts: all
  gather_facts: no
  vars:
    ansible_python_interpreter: /usr/bin/python3
    install_kernel_dbgsym: false
    install_host_jdks: false
  roles:
    - appliance-build.minimal-common
    - appliance-build.minimal-internal
    - appliance-build.dct-common
    #
    # A DCT release that doesn't ship UCF (PUC) builds without its packages:
    # devops-gate's appliance-build-stage1 sets DELPHIX_INCLUDE_UCF=false
    # from INCLUDE_UCF, and leaves AWS_S3_URI_UCF_PACKAGES empty. Unset, or
    # any other value, installs UCF as before.
    #
    - role: appliance-build.ucf-common
      when: lookup('env', 'DELPHIX_INCLUDE_UCF') != 'false'
    - appliance-build.virtualization-common
    - appliance-build.virtualization-development
    - appliance-build.qa-internal
